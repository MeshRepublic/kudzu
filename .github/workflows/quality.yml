name: quality + tests

on:
  # All PRs, not only those targeting main: stacked PRs are based on their
  # parent branch and would otherwise never be tested.
  pull_request:
  # Every push, so the secret scan covers branches that have no PR yet. The
  # quality and test jobs still run only for PRs and for pushes to main.
  push:

env:
  MIX_ENV: test
  # CI needs a key set because config/runtime.exs raises without one.
  # Value is harmless — no production secrets in CI.
  KUDZU_API_KEY: ci-test-key
  # Pin Nx to the binary backend; EXLA requires NIFs we don't ship in CI.
  NX_DEFAULT_BACKEND: binary

jobs:
  quality:
    name: mix quality (format + credo + dialyzer)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.17.3"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-otp27-elixir1.17-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-deps-

      - name: Restore _build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-otp27-elixir1.17-build-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-build-${{ env.MIX_ENV }}-

      # PLT is expensive (~10 min cold build). Cache it on mix.lock hash so it
      # only rebuilds when deps change.
      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: |
            _build/test/dialyxir_*.plt
            _build/test/dialyxir_*.plt.hash
          key: ${{ runner.os }}-otp27-elixir1.17-plt-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-plt-

      - name: Fetch deps
        run: mix deps.get

      - name: Compile (warnings_as_errors enforced via mix.exs)
        run: mix compile

      - name: Build PLT (if not cached)
        run: mix dialyzer --plt

      - name: Run mix quality
        run: mix quality

  test:
    name: mix test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.17.3"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-otp27-elixir1.17-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-deps-

      - name: Restore _build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-otp27-elixir1.17-build-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-build-${{ env.MIX_ENV }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Run tests (excludes :external by default)
        run: mix test --warnings-as-errors

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth 0 fetches every branch and tag with complete history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs the pinned gitleaks image directly rather than gitleaks-action,
      # which needs a licence key for organisation repositories. --verbose
      # prints each finding (rule, file, commit, fingerprint) so a failure is
      # actionable; --redact keeps the finding's value out of the job log.
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --verbose --redact --log-opts="--all" /repo
