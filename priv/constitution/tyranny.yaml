# Anti-sovereignty historical artifacts — seeds for the rejection silo.
#
# AUTHORING RULE (per spec decision #1): descriptions must be
# PRINCIPLE-GENERAL, not statute-specific. The HRR vector for each
# description is what generalizes to modernized variants of the same
# tyranny. Statute names belong in citation, principles in description.
#
# Bad:  description: "Patriot Act §215 collected phone records in bulk"
# Good: description: "compelled bulk surveillance of communications without
#                     individualized warrant"
#
# Each entry feeds Kudzu.Constitution.Tyranny.TyrannyArtifacts which
# vectorizes the description and writes the vector + citation + principle
# to the rejection silo.

